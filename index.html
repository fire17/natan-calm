<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שקט — צלילים לנשימה ולמנוחה</title>
<meta name="description" id="metaDesc" content="צלילים מרגיעים שנוצרים בזמן אמת בדפדפן: פעימות בינאוריות, מוזיקת רקע וצלילי טבע.">
<meta name="theme-color" content="#0a0f2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" id="metaAppTitle" content="שקט">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='40%25' cy='35%25' r='70%25'%3E%3Cstop offset='0' stop-color='%23a7f3e4'/%3E%3Cstop offset='.55' stop-color='%233aa5a8'/%3E%3Cstop offset='1' stop-color='%23312e81'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a0f2c'/%3E%3Ccircle cx='32' cy='32' r='19' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<main class="app">
  <section class="hero">
    <header class="brand">
      <div class="lang" role="group" aria-label="שפה" data-i18n-aria="langAria">
        <button type="button" lang="he" dir="rtl" data-lang="he" aria-pressed="true">עברית</button>
        <span class="lang-sep" aria-hidden="true"></span>
        <button type="button" lang="ru" dir="ltr" data-lang="ru" aria-pressed="false">Русский</button>
      </div>
      <h1 data-i18n="appName">שקט</h1>
      <p class="tagline" data-i18n="tagline">צלילים לנשימה ולמנוחה</p>
    </header>

    <div class="orb-wrap">
      <button id="play" class="orb" type="button" aria-pressed="false" aria-label="התחלה">
        <span class="orb-halo" aria-hidden="true"></span>
        <span class="orb-core" aria-hidden="true">
          <svg class="ico ico-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          <svg class="ico ico-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="4" height="13" rx="1.4" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1.4" fill="currentColor"/></svg>
        </span>
      </button>
      <p id="playLabel" class="play-label">הקישו כדי להתחיל</p>
      <p class="breath" aria-hidden="true"><span class="in" data-i18n="breathIn">שאיפה</span><span class="out" data-i18n="breathOut">נשיפה</span></p>
    </div>

    <p class="hint" data-i18n="hint">🎧 לחוויה מלאה — אוזניות</p>

    <div id="sleepCard" class="card sleep-card">
      <button id="sleepToggle" class="sleep-toggle" type="button" role="switch" aria-checked="false">
        <span class="sleep-moon" aria-hidden="true">🌙</span>
        <span class="sleep-text"><span class="sleep-title" data-i18n="sleepTitle">מצב שינה</span><small data-i18n="sleepSub">נרדמים לאט, והצליל נמוג לשקט</small></span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <div id="sleepDurs" class="chips sleep-durs" role="group" aria-label="משך מצב שינה" data-i18n-aria="sleepDursAria"></div>
      <button id="sleepVoice" class="mini-switch" type="button" role="switch" aria-checked="true">
        <span><span data-i18n="sleepVoice">עם קול מנחה</span> <small id="sleepVoiceNote"></small></span>
        <span class="switch" aria-hidden="true"></span>
      </button>
    </div>

    <div class="card">
      <h2 data-i18n="presetsTitle">מצבים מוכנים</h2>
      <div id="presets" class="chips" role="group" aria-label="מצבים מוכנים" data-i18n-aria="presetsTitle"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-i18n="timerTitle">טיימר</h2>
        <span id="timerLeft" class="timer-left" aria-live="polite"></span>
      </div>
      <div id="timers" class="chips" role="group" aria-label="טיימר" data-i18n-aria="timerTitle"></div>
    </div>
  </section>

  <section class="mixer">
    <div class="card">
      <h2 data-i18n="binauralTitle">פעימות בינאוריות</h2>
      <div id="modes" class="chips modes" role="group" aria-label="מצב פעימות" data-i18n-aria="modesAria"></div>
    </div>

    <div class="card">
      <h2 data-i18n="layersTitle">שכבות</h2>
      <div id="layers" class="layers"></div>
    </div>

    <div class="card master">
      <label class="row" for="master">
        <span class="row-name" data-i18n="master">עוצמה כללית</span>
        <input id="master" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="עוצמה כללית" data-i18n-aria="master">
      </label>
    </div>

    <div id="voiceCard" class="card voice unready" aria-disabled="true">
      <div class="card-head">
        <h2 data-i18n="voiceTitle">קול מנחה</h2>
        <span id="voiceStatus" class="soon" data-i18n="voiceSoon">הקול בהכנה</span>
      </div>
      <div id="voicePicker" class="chips voices" role="group" aria-label="בחירת קול" data-i18n-aria="voicePickerAria"></div>
      <div id="sessions" class="sessions" role="group" aria-label="מפגשים מודרכים" data-i18n-aria="sessionsAria"></div>
      <p id="voiceCaption" class="voice-caption" aria-live="polite" hidden></p>
    </div>
  </section>
</main>

<div id="sleepScreen" class="sleep-screen" hidden>
  <p class="night" data-i18n="night">לילה טוב</p>
  <div class="sleep-ctrls">
    <p id="sleepLeft" class="sleep-left" aria-live="off"></p>
    <button id="sleepExit" class="chip" type="button">יציאה ממצב שינה</button>
  </div>
</div>

<footer class="foot">v0.7 · <span data-i18n="foot">כל הצלילים נוצרים בזמן אמת בדפדפן</span></footer>

<script src="app.js"></script>
</body>
</html>
